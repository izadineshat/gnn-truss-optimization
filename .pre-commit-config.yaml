# pre-commit hooks: cheap checks before every commit.
# Install once with:  uv run pre-commit install
# Run on demand with: uv run pre-commit run --all-files
minimum_pre_commit_version: "3.7.0"
default_language_version:
  python: python3.12

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=2048"]
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        files: ^(src|tests)/
        additional_dependencies: ["numpy>=1.26"]
        args: ["--strict"]

  - repo: local
    hooks:
      - id: pytest-fast
        name: pytest (fast subset)
        entry: uv run pytest -q -m "not slow"
        language: system
        pass_filenames: false
        always_run: true